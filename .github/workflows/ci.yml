name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, boundaries, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint (includes engine bans on Math.random / Date / fetch)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Module boundaries (dependency-cruiser)
        run: npm run deps:check
      - name: Boundary rules fail on deliberate violations
        run: npm run boundaries:verify
      - name: Content validation
        run: npm run content:validate
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Playwright + axe
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
